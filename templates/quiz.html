<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuizCraft - Quiz</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <header>
            <h1>{{ quiz.deck_name }}</h1>
            <p>Player: {{ quiz.player_name }}</p>
        </header>
        <section class="card">
            <p class="progress">Question {{ question_number }} of {{ total }}</p>
            <h2>{{ question.text }}</h2>
            <form method="POST">
                {% if question.choices %}
                    {% for key, value in question.choices.items() %}
                        <label class="option">
                            <input type="radio" name="answer" value="{{ key }}" required>
                            {{ key }}) {{ value }}
                        </label>
                    {% endfor %}
                {% else %}
                    <input type="text" name="answer" placeholder="Enter your answer" required>
                {% endif %}
                <button type="submit">Submit Answer</button>
            </form>
        </section>
    </div>
</body>
</html>
